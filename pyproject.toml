[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enter-harness"
dynamic = ["version"]
description = "企业级智能体运行时内核：可替换模型/存储/权限，内置审批、审计、检查点与多租户隔离"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 宿主自带的模型/存储适配器通常只需要上面三项；OCR/文档类能力按需引入
ocr = ["pypdf>=6.0"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
# 只打包 enter_harness（含 agent_core 兼容层）；tests/ 等属于测试资产，不进入库
include = ["enter_harness*", "agent_core*"]

[tool.setuptools.dynamic]
# 版本单一来源：enter_harness/_version.py；避免 __version__ 与发行元数据漂移
version = { attr = "enter_harness._version.__version__" }
